vo=gpu-next
gpu-dumb-mode=no
vd-lavc-dr=yes
profile=gpu-hq
opengl-es=yes
gpu-api=opengl
gpu-context=android
gpu-hwdec-interop=all
hwdec=mediacodec-copy
hwdec-extra-frames=8
hwdec-threads=8
vd-lavc-check-hw-profile=no

scale=lanczos
cscale=lanczos
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

dither=error-diffusion
dither-depth=8
dither-size-fruit=8
temporal-dither=yes
temporal-dither-period=120
error-diffusion=atkinson

#interpolation=yes
#tscale=oversample
#video-sync=display-resample
#display-fps-override=120
opengl-waitvsync=yes
opengl-swapinterval=1
opengl-pbo=yes
gpu-debug=no
egl-output-format=rgba16f
opengl-glfinish=no
gpu-sw=no
opengl-early-flush=no

target-prim=display-p3
target-trc=srgb
target-gamut=display-p3
#gamut-mapping-mode=saturation
target-colorspace-hint=yes
target-colorspace-hint-mode=target
#vf=format=yuv420p
#inverse-tone-mapping=yes
#tone-mapping=spline
#gamut-mapping-mode=perceptual

# Dynamic HDR analysis
#hdr-compute-peak=auto

# Preserve image detail
#tone-mapping-spline-contrast=0.5
#tone-mapping-knee-adaptation=0.4

# Color accuracy

#glsl-shaders="/storage/emulated/0/mpvRx/FSRCNNX_x2_8-0-4-1.glsl:/storage/emulated/0/mpvRx/KrigBilateral.glsl"

#glsl-shaders="/storage/emulated/0/mpvRx/NetGG.glsl"

network-timeout=90
osd-font="Be Vietnam Pro"
force-seekable=yes
fbo-format=rgba16f
video-output-levels=full
blend-subtitles=yes
framedrop=vo
sub-auto=fuzzy
hr-seek-framedrop=no
#demuxer-max-bytes=1000MiB
#demuxer-readahead-secs=300
#demuxer-max-back-bytes=40MiB
#video-reversal-buffer=0MiB
cache=yes
cache-on-disk=yes
#log-file=/storage/emulated/0/mpvRx/mpv-console-log.txt
#msg-level=all=v
ytdl=yes

ytdl-format="bestvideo[height<=1080][vcodec^=avc1]+bestaudio/bestvideo[height<=1080][vcodec^=vp09]+bestaudio/bestvideo[height<=1080][vcodec^=hev1]+bestaudio"

#user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36"
#[youtube]
#profile-cond=(path or ""):find("youtube%.com") ~= nil or (path or ""):find("youtu%.be") ~= nil
#profile-restore=copy
#hwdec-codecs=hevc,h264,vp9

#scale=catmull_rom
#cscale=catmull_rom
#dscale=mitchell

#sigmoid-upscaling=yes
#correct-downscaling=yes
#linear-downscaling=yes

[fill-2.0-2.2]
profile-cond=height and (width / height) >= 2.0 and (width / height) < 2.2
profile-restore=copy
video-aspect-override=20:9
panscan=0

# 1.9–2.0: méo ~5–10%, cắt ~5%
[fill-1.9-2.0]
profile-cond=height and (width / height) >= 1.9 and (width / height) < 2.0
profile-restore=copy
video-aspect-override=2.0
panscan=0.2
# 1.7–1.9 (16:9 = 1.78, 1.85): méo ~5–15%, cắt ~12%
[fill-1.7-1.9]
profile-cond=height and (width / height) >= 1.7 and (width / height) < 1.9
profile-restore=copy
video-aspect-override=2.15
panscan=0.3

# 1.6–1.7 (16:10): méo ~6–12%, cắt ~19%
[fill-1.6-1.7]
profile-cond=height and (width / height) >= 1.6 and (width / height) < 1.7
profile-restore=copy
video-aspect-override=1.8
panscan=1
    